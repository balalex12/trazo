# One CI workflow for pull requests and pushes to main. Least privilege: read-only token, no secrets, no
# pull_request_target. PRs from forks run with a read-only token and no access to repository secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:typecheck
      - run: yarn test:other
      - run: yarn test:code
      # A test that fails and then passes on a retry is accepted: a few inherited editor tests (clipboard, collab)
      # are timing sensitive and fail at random on busy CI machines. A test that keeps failing still fails the build.
      - run: yarn test:app --watch=false --retry=2

  # Browser tests (tools/e2e, docs/TESTING.md): the app in a real Chrome, local-first, import, the notebook panel.
  # A separate job, so a problem here never hides the result of the checks above.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      # starts the app itself and uses the Chrome that comes with the runner
      - run: yarn test:e2e

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Build every image (the app with its icon libraries, the map viewer, the notebooks, the MCP server)
        run: docker compose --profile mcp build
      - name: Start the stack and check that every part answers
        run: |
          docker compose up -d
          for port in 3000 3001 3002; do
            ok=false
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port/"; then ok=true; break; fi
              sleep 2
            done
            "$ok" || { echo "Nothing answered on port $port"; docker compose logs; exit 1; }
            echo "port $port answers"
          done
          # the headers come from the server configuration inside the images
          for port in 3000 3001 3002; do
            curl -fsSI "http://127.0.0.1:$port/" | grep -i '^content-security-policy' > /dev/null || { echo "no Content-Security-Policy on $port"; exit 1; }
          done
          # the icon libraries are in the app image (the full library, with the Esri Architecture Center icons)
          curl -fsS http://127.0.0.1:3000/arcgis.excalidrawlib | grep -c "Esri Architecture Center" | grep -qv '^0$'
          docker compose down
