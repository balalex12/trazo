# One CI workflow for pull requests and pushes to main. Least privilege: read-only token, no secrets, no
# pull_request_target. PRs from forks run with a read-only token and no access to repository secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:typecheck
      - run: yarn test:other
      - run: yarn test:code
      # A test that fails and then passes on a retry is accepted: a few inherited editor tests (clipboard, collab)
      # are timing sensitive and fail at random on busy CI machines. A test that keeps failing still fails the build.
      - run: yarn test:app --watch=false --retry=2

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - run: docker build -t trazo-app:ci .
