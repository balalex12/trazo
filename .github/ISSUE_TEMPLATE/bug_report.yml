name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      {
        label: What happened?,
        description: Steps to reproduce and what you expected,
      }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Browser and OS }
  - type: dropdown
    id: portal
    attributes:
      label: ArcGIS portal involved (if any)
      options:
        [
          None,
          ArcGIS Online,
          ArcGIS Enterprise (11.x),
          ArcGIS Enterprise (10.x),
        ]
  - type: textarea
    id: logs
    attributes:
      {
        label: Console output / screenshots,
        description: "Never paste tokens, API keys or private URLs",
      }
