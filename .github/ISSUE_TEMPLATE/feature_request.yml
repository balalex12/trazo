name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? (architecture, data, GIS, ML...) }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
  - type: checkboxes
    id: localfirst
    attributes:
      label: Local-first check
      options:
        - label: It does not require contacting a server by default (or it is user-initiated and documented)
