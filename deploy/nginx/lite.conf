server {
  listen 3002;
  listen [::]:3002;
  server_name _;
  root /srv/lite;
  index index.html;
  server_tokens off;

  # JupyterLite (Python notebooks in the browser, see docs/NOTEBOOKS.md). Everything it needs, Pyodide and the Python
  # packages included, is served from this folder, so the policy allows NO other origin: connect-src 'self' means a
  # notebook cannot fetch from the network either (its Python runs in a WebAssembly sandbox in the tab).
  # The policy is written by tools/build-jupyterlite.mjs next to the site (it holds the hash of each inline script,
  # and `frame-ancestors`: who may embed this site, the Trazo app on localhost:3000 by default). nginx will not
  # start until the site has been built, on purpose.
  include /srv/lite/_csp.conf;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # the notebooks change when you rebuild, so always revalidate (the files are large but this is a local server)
  add_header Cache-Control "no-cache, must-revalidate" always;

  types {
    text/html html htm;
    text/css css;
    application/javascript js mjs;
    application/json json map webmanifest;
    application/wasm wasm;
    application/zip zip whl;
    image/svg+xml svg;
    image/png png;
    image/x-icon ico;
    font/woff2 woff2;
    font/woff woff;
    font/ttf ttf;
    text/plain txt;
  }
  default_type application/octet-stream;

  location = /_csp.conf {
    return 404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
