server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The ArcGIS Maps SDK is loaded from Esri's CDN, so the viewer needs https: for scripts/connect/img.
  # Inline scripts are not allowed (the viewer code lives in viewer.js).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.arcgis.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://js.arcgis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://js.arcgis.com; connect-src 'self' data: blob: https:; worker-src 'self' blob: https://js.arcgis.com; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' http://localhost:3000 http://127.0.0.1:3000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-write=(self)" always;
  add_header Cache-Control "no-cache, must-revalidate" always;

  location / {
    try_files $uri $uri/ =404;
  }
}
