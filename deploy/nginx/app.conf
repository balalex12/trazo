server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Strict CSP generated at build time (inline script hashes). Do not add add_header inside location blocks:
  # nginx would then drop these server-level headers.
  include /etc/nginx/conf.d/csp.inc;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control "no-cache, must-revalidate" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional pass-through to Ollama Cloud. Browsers cannot call ollama.com directly (it sends no CORS headers),
  # so the app talks to this same-origin path when the "Ollama Cloud" preset is selected. Nothing is contacted
  # unless the app sends a request here. The API key comes from the browser's Authorization header; it is not
  # stored on the server. Only ollama.com is reachable; cookies/origin/referer are not forwarded.
  # The upstream is resolved per request (variable + resolver), so nginx still starts when you are offline.
  location /llm/ollama-cloud/ {
    limit_except GET POST { deny all; }
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=30s ipv6=off;   # Docker's embedded DNS
    set $ollama_cloud "https://ollama.com";
    rewrite ^/llm/ollama-cloud/(.*)$ /$1 break;
    proxy_pass $ollama_cloud;
    proxy_ssl_server_name on;
    proxy_ssl_name ollama.com;
    proxy_http_version 1.1;
    proxy_set_header Host ollama.com;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_buffering off;            # keep the SSE stream flowing
    proxy_cache off;
    proxy_read_timeout 300s;
  }
}
