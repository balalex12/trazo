# Hardened, local-only deployment (see docs/SECURITY.md).
#   - ports are bound to 127.0.0.1: not reachable from your LAN
#   - read-only root filesystem, all capabilities dropped except what nginx needs, no privilege escalation
#   - everything is built from this repository, inside Docker: `docker compose up -d --build` is the whole installation
#     (one image: the app on 3000, the ArcGIS map viewer on 3001, the Python notebooks on 3002). Nothing is pulled from Excalidraw.
name: trazo

services:
  # The whole product in one image: the app (3000), the ArcGIS map viewer (3001) and the Python notebooks (3002).
  # The first build downloads the icon libraries and about 230 MB for the notebooks (checked against pinned hashes).
  trazo:
    build:
      context: .
      args:
        - NODE_ENV=production
        # Optional: move the ArcGIS viewer off its default origin (same host, port 3001).
        # Uncomment and set if you changed the viewer's port below, or put the viewer behind its own
        # domain/tunnel. See the Dockerfile and docs/VIEWER.md (and frame-ancestors in deploy/nginx/viewer.conf).
        # - ARCGIS_VIEWER_ORIGIN=http://localhost:3400
    image: trazo:local
    container_name: trazo
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Optional MCP server (docs/MCP.md): not started by `docker compose up`. An MCP client (Claude Desktop, Claude Code)
  # starts it on demand over stdin/stdout. No network at all; it only reads and writes ./diagrams.
  #   docker compose --profile mcp build mcp
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: trazo-mcp:local
    stdin_open: true
    network_mode: none
    volumes:
      - ./diagrams:/work
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
